<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BadgeBot</title><style>body{font-family:system-ui;background:#0f141b;color:#e9eef4;max-width:420px;margin:0 auto;padding:12px}h2{margin:8px 0}fieldset{border:1px solid #2a323c;border-radius:8px;margin:12px 0}legend{color:#ffd928;padding:0 6px}label{display:block;color:#93a3b0;font-size:13px;margin-top:8px}input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;background:#11161d;color:#e9eef4;border:1px solid #2a323c;border-radius:6px}textarea{font:14px/1.5 system-ui;resize:vertical}button{padding:10px 18px;background:#ffd928;color:#111;border:0;border-radius:6px;font-weight:700}button.minor{background:#2a323c;color:#e9eef4;font-weight:400}button.done{width:100%;margin-top:12px;background:#2ea043;color:#fff}span{margin-left:8px;font-size:14px;color:#7ce38b}.chk{display:flex;align-items:center;gap:8px;margin:8px 0}.chk input{width:auto}.slott{margin-top:12px;padding-top:6px;border-top:1px dashed #2a323c;font-weight:700;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center}.hint{color:#93a3b0;font-size:13px;margin-top:14px}#beat{font-size:13px;margin-top:10px;color:#7ce38b}#cwrap{position:relative;font-size:0;line-height:0;margin-top:6px}#cimg{max-width:280px;max-height:280px}#cbox{position:absolute;border:2px dashed #ffd928;touch-action:none;box-sizing:border-box}#chandle{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:#ffd928;border-radius:3px;touch-action:none}</style></head><body><div class='top'><h2>BadgeBot</h2><button id='btnlang' class='minor' onclick='toggleLang()'>EN</button></div><p id='beat'></p><fieldset><legend id='l_wifi'>Wi-Fi(仅支持 2.4GHz)</legend><label id='l_ssid'>SSID</label><input id='ssid'><label id='l_pass'>密码</label><input id='pass' type='password'><button id='b_savewifi' onclick='saveWifi()'>保存 Wi-Fi</button><span id='wm'></span></fieldset><fieldset><legend id='l_card'>名片</legend><label id='l_name'>姓名</label><input id='bname'><label id='l_org'>公司</label><input id='borg'><label id='l_title'>岗位</label><input id='btitle'><div class='chk'><input id='bhide' type='checkbox'><label id='l_hide' for='bhide'>隐藏公司/岗位</label></div><button id='b_savecard' onclick='saveCfg()'>保存名片</button><span id='cm'></span></fieldset><fieldset><legend id='l_qrs'>二维码(4 槽,每槽可选 网页生成 或 上传图片)</legend><div id='qrs'></div><button id='b_saveqr' onclick='saveQr()'>保存二维码设置</button><span id='qrm'></span></fieldset><fieldset><legend id='l_vurl'>语音(电脑后端地址)</legend><label id='l_vurl2'>后端 URL(http://电脑IP:端口)</label><input id='vurl' placeholder=http://192.168.1.10:8722><button id='b_savevurl' onclick='saveVoice()'>保存语音地址</button><span id='vm'></span><p id='vhint' class='hint'>电脑上先运行 tools/badge_voice.py,再把它的地址填到这里;徽章上说话会传到这台电脑识别,文字直接打进当前窗口。</p></fieldset><fieldset><legend id='l_notes'>提词稿(一行 = 一段/PPT 一页)</legend><textarea id='notes' rows=5></textarea><div class=slott id='notesn'></div><label id='l_ntxt'>或上传 .txt(每行一页)</label><input type=file id='fnt' accept=.txt><button id='b_ntxt' class=minor>读入 txt</button><label id='l_npx'>或上传 .pptx 自动提取每页备注</label><input type=file id='fpx' accept=.pptx><button id='b_npx' class=minor>提取备注</button><button id='b_ns'>保存提词稿</button><button id='b_nc' class='minor'>清除</button><span id='nm'></span></fieldset><fieldset><legend id='l_img'>图片(手动裁剪为正方形)</legend><label id='l_avatar'>头像(输出 96x96)</label><input type='file' id='fav' accept='image/*'><button id='b_upav' onclick="openCrop(fid('fav').files[0],'/api/avatar',96,'rgb565',fid('am'))">裁剪并上传头像</button><button id='b_clr1' class='minor' onclick="clr('/api/avatar',fid('am'))">清除</button><span id='am'></span><div id='crop' style='display:none;margin-top:10px'><label id='l_crop'>拖动虚线框选裁剪区;右下角手柄缩放(默认居中)</label><div id='cwrap'><img id='cimg'><div id='cbox'><div id='chandle'></div></div></div><button id='b_cropok' onclick='finishCrop()'>确认上传</button><button id='b_cancel' class='minor' onclick='cancelCrop()'>取消</button></div></fieldset><button id='b_done' class='done' onclick='finish()'>完成并联网</button><span id='dm'></span><p id='hint' class='hint'>保存 Wi-Fi 后热点保持开启;完成所有修改后点「完成并联网」,工牌会关闭热点并立即联网校时。</p><script>var LANG=0;var D={zh:{wifi:'Wi-Fi(仅支持 2.4GHz)',ssid:'SSID',pass:'密码',savewifi:'保存 Wi-Fi',card:'名片',name:'姓名',org:'公司',title:'岗位',hide:'隐藏公司/岗位',savecard:'保存名片',qrs:'二维码(4 槽,每槽可选 网页生成 或 上传图片)',ql:'槽位说明(如:微信)',vurl:'语音(电脑后端地址)',vurl2:'后端 URL(http://电脑IP:端口)',savevurl:'保存语音地址',vhint:'电脑上先运行 tools/badge_voice.py,再把它的地址填到这里;徽章上说话会传到这台电脑识别,文字直接打进当前窗口。',qg:'网页生成',qu:'上传图片',qph:'链接或文本',upq:'裁剪并上传',saveqr:'保存二维码设置',notes:'提词稿(一行 = 一段/PPT 一页)',ntxt:'或上传 .txt(每行一页)',npx:'或上传 .pptx 自动提取每页备注',rdtxt:'读入 txt',expx:'提取备注',saven:'保存提词稿',nseg:'段',nempty:'内容为空',nbig:'超过 32KB 上限',perr:'pptx 解析失败(需 .pptx;老 .ppt 请先另存为 .pptx)',pnone:'未找到备注页',pbrowser:'浏览器太旧,不支持解压',img:'图片(手动裁剪为正方形)',avatar:'头像(输出 96x96)',upav:'裁剪并上传头像',clr:'清除',crop:'拖动虚线框选裁剪区;右下角手柄缩放(默认居中)',ok:'确认上传',cancel:'取消',done:'完成并联网',pick:'请先选择图片',dec:'图片解码失败,请换 JPG/PNG 试',proc:'处理中…',uping:'上传中…',net:'网络错误(热点可能已关闭)',alive:'热点在线 · 剩余约 ',unit:' 秒',dead:'设备不可达:热点可能已关闭,请在工牌重新进入配网后刷新本页',hint:'热点在倒计时结束前一直开放,手机随时断开重连都可用;资料传完后点「完成并联网」立即校时(热点不关),倒计时结束热点自动关闭。'},en:{wifi:'Wi-Fi (2.4GHz only)',ssid:'SSID',pass:'Password',savewifi:'Save Wi-Fi',card:'Card',name:'Name',org:'Company',title:'Title',hide:'Hide company/title',savecard:'Save card',qrs:'QR codes (4 slots; each: generated or uploaded image)',ql:'Caption (e.g. WeChat)',vurl:'Voice (PC backend URL)',vurl2:'Backend URL (http://pc-ip:port)',savevurl:'Save voice URL',vhint:'Run tools/badge_voice.py on the PC first, then enter its address here; speech on the badge is recognized on that PC and typed into the focused window.',qg:'Generated',qu:'Uploaded image',qph:'Link or text',upq:'Crop && upload',saveqr:'Save QR setup',notes:'Notes (one line = one segment/slide)',ntxt:'or upload .txt (one line per slide)',npx:'or upload .pptx to extract speaker notes',rdtxt:'Load txt',expx:'Extract notes',saven:'Save notes',nseg:'segments',nempty:'empty',nbig:'over the 32KB limit',perr:'pptx parse failed (needs .pptx; re-save legacy .ppt first)',pnone:'no speaker notes found',pbrowser:'browser too old to inflate',img:'Images (manual square crop)',avatar:'Avatar (96x96 out)',upav:'Crop && upload avatar',clr:'Clear',crop:'Drag the dashed box to crop; corner handle resizes (centered by default)',ok:'Upload',cancel:'Cancel',done:'Finish && connect',pick:'Pick an image first',dec:'Decode failed, try JPG/PNG',proc:'Working…',uping:'Uploading…',net:'Network error (hotspot may be closed)',alive:'Hotspot online · about ',unit:'s left',dead:'Device unreachable - hotspot may be closed; reopen provisioning on the badge and refresh',hint:'The hotspot stays on until the countdown ends; the phone can reconnect any time. When uploads are done, press Finish to sync the clock now (hotspot stays open); it closes automatically when the countdown runs out.'}};function fid(id){return document.getElementById(id)}function T(k){return (LANG?D.en:D.zh)[k]}function msg(m,t,ok){m.textContent=t;m.style.color=ok?'#7ce38b':'#ff6b6b'}function applyLang(){fid('btnlang').textContent=LANG?'中文':'EN';fid('l_wifi').textContent=T('wifi');fid('l_ssid').textContent=T('ssid');fid('l_pass').textContent=T('pass');fid('b_savewifi').textContent=T('savewifi');fid('l_card').textContent=T('card');fid('l_name').textContent=T('name');fid('l_org').textContent=T('org');fid('l_title').textContent=T('title');fid('l_hide').textContent=T('hide');fid('b_savecard').textContent=T('savecard');fid('l_qrs').textContent=T('qrs');fid('b_saveqr').textContent=T('saveqr');fid('l_vurl').textContent=T('vurl');fid('l_vurl2').textContent=T('vurl2');fid('b_savevurl').textContent=T('savevurl');fid('vhint').textContent=T('vhint');for(var i=0;i<4;i++){fid('l_ql'+i).textContent=T('ql');fid('l_qg'+i).textContent=T('qg');fid('l_qu'+i).textContent=T('qu');fid('qt'+i).placeholder=T('qph');fid('b_upq'+i).textContent=T('upq');fid('b_clrq'+i).textContent=T('clr')}fid('l_notes').textContent=T('notes');fid('l_ntxt').textContent=T('ntxt');fid('l_npx').textContent=T('npx');fid('b_ntxt').textContent=T('rdtxt');fid('b_npx').textContent=T('expx');fid('b_ns').textContent=T('saven');fid('b_nc').textContent=T('clr');notesCount();fid('l_img').textContent=T('img');fid('l_avatar').textContent=T('avatar');fid('b_upav').textContent=T('upav');fid('b_clr1').textContent=T('clr');fid('l_crop').textContent=T('crop');fid('b_cropok').textContent=T('ok');fid('b_cancel').textContent=T('cancel');fid('b_done').textContent=T('done');fid('hint').textContent=T('hint')}function toggleLang(){LANG=1-LANG;applyLang()}function sv(u,b,m){msg(m,T('proc'),true);fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.text()}).then(function(t){msg(m,t,true)}).catch(function(e){msg(m,T('net'),false)})}function saveWifi(){sv('/api/wifi',{ssid:fid('ssid').value,pass:fid('pass').value},fid('wm'))}function saveCfg(){sv('/api/config',{name:fid('bname').value,org:fid('borg').value,title:fid('btitle').value,hide:fid('bhide').checked},fid('cm'))}function saveVoice(){sv('/api/config',{voice_url:fid('vurl').value},fid('vm'))}/* ---- 二维码 4 槽:每槽独立选择 生成(文本) 或 上传图片;HTML 无引号写法省转义 ---- */function qmode(i){var up=fid('qu'+i).checked;fid('qt'+i).style.display=up?'none':'block';fid('fq'+i).style.display=up?'block':'none';fid('b_upq'+i).style.display=up?'inline-block':'none';fid('b_clrq'+i).style.display=up?'inline-block':'none'}function buildQr(){var h='';for(var i=0;i<4;i++){h+='<div class=slott>QR'+(i+1)+'</div>'+'<label id=l_ql'+i+'></label><input id=ql'+i+' maxlength=23>'+'<div class=chk><input type=radio name=qm'+i+' id=qg'+i+'><label id=l_qg'+i+' for=qg'+i+'></label>'+'<input type=radio name=qm'+i+' id=qu'+i+'><label id=l_qu'+i+' for=qu'+i+'></label></div>'+'<input id=qt'+i+'>'+'<input type=file id=fq'+i+' accept=image/*>'+'<button id=b_upq'+i+' class=minor></button>'+'<button id=b_clrq'+i+' class=minor></button><span id=q'+i+'m></span>';}fid('qrs').innerHTML=h;for(var i=0;i<4;i++){(function(i){fid('qg'+i).addEventListener('change',function(){qmode(i)});fid('qu'+i).addEventListener('change',function(){qmode(i)});fid('b_upq'+i).addEventListener('click',function(){openCrop(fid('fq'+i).files[0],'/api/qr'+i,128,'bw',fid('q'+i+'m'))});fid('b_clrq'+i).addEventListener('click',function(){clr('/api/qr'+i,fid('q'+i+'m'))});})(i)}}function saveQr(){var b={qr_text:[],qr_label:[],qr_mode:0};for(var i=0;i<4;i++){b.qr_text.push(fid('qt'+i).value);b.qr_label.push(fid('ql'+i).value);if(fid('qu'+i).checked)b.qr_mode|=(1<<i)}sv('/api/config',b,fid('qrm'))}/* ---- 提词稿:归一化成一行一段;txt 读入;pptx 备注提取(浏览器解包,零依赖) ---- */function notesText(){return fid('notes').value.split(/\r?\n/).map(function(s){return s.replace(/\r$/,'')}).filter(function(s){return s.length>0}).join('\n')}function notesCount(){if(!fid('notesn'))return;var t=notesText();fid('notesn').textContent=(t?t.split('\n').length:0)+' '+T('nseg')}function saveNotes(){var t=notesText();if(!t){msg(fid('nm'),T('nempty'),false);return}if(t.length>32768){msg(fid('nm'),T('nbig'),false);return}msg(fid('nm'),T('proc'),true);fetch('/api/notes',{method:'POST',headers:{'Content-Type':'text/plain'},body:t}).then(function(r){return r.text()}).then(function(tx){msg(fid('nm'),tx,true)}).catch(function(e){msg(fid('nm'),T('net'),false)})}function loadTxt(){var f=fid('fnt').files[0];if(!f){msg(fid('nm'),T('pick'),false);return}var r=new FileReader();r.onload=function(){fid('notes').value=r.result;notesCount();msg(fid('nm'),T('ok'),true)};r.readAsText(f,'utf-8')}function rdU16(b,o){return b[o]|(b[o+1]<<8)}function rdU32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)+b[o+3]*16777216)>>>0}function loadPptx(){var f=fid('fpx').files[0];if(!f){msg(fid('nm'),T('pick'),false);return}if(typeof DecompressionStream=='undefined'){msg(fid('nm'),T('pbrowser'),false);return}msg(fid('nm'),T('proc'),true);var r=new FileReader();r.onload=function(){try{parsePptx(new Uint8Array(r.result))}catch(e){msg(fid('nm'),T('perr'),false)}};r.readAsArrayBuffer(f)}function parsePptx(b){var e=-1,i;for(i=b.length-22;i>=0&&i>b.length-22-65536;i--){if(b[i]==0x50&&b[i+1]==0x4b&&b[i+2]==0x05&&b[i+3]==0x06){e=i;break}}if(e<0)throw 0;var n=rdU16(b,e+10),cd=rdU32(b,e+16),items=[];for(var k=0;k<n;k++){if(!(b[cd]==0x50&&b[cd+1]==0x4b&&b[cd+2]==0x01&&b[cd+3]==0x02))break;var cs=rdU32(b,cd+20),nl=rdU16(b,cd+28),el=rdU16(b,cd+30),cl=rdU16(b,cd+32),lho=rdU32(b,cd+42);var name='';for(var j=0;j<nl;j++)name+=String.fromCharCode(b[cd+46+j]);items.push({n:name,cs:cs,lho:lho});cd+=46+nl+el+cl}var rx=/^ppt\/notesSlides\/notesSlide\d+\.xml$/;var slides=items.filter(function(x){return rx.test(x.n)});slides.sort(function(a,c){return parseInt(a.n.replace(/[^\d]/g,''),10)-parseInt(c.n.replace(/[^\d]/g,''),10)});if(!slides.length){msg(fid('nm'),T('pnone'),false);return}var outs=[],done=0;slides.forEach(function(x,ix){var hl=rdU16(b,x.lho+26)+rdU16(b,x.lho+28);var data=b.subarray(x.lho+30+hl,x.lho+30+hl+x.cs);new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(ab){var xml=new TextDecoder('utf-8').decode(ab);var parts=xml.match(/<a:t>[^<]*<\/a:t>/g)||[];outs[ix]=parts.map(function(s){return s.replace(/<\/?a:t>/g,'')}).join(' ');if(++done==slides.length){fid('notes').value=outs.filter(function(s){return s}).join('\n');notesCount();msg(fid('nm'),T('ok'),true)}}).catch(function(){msg(fid('nm'),T('perr'),false)})})}function finish(){sv('/api/done',{},fid('dm'))}function clr(u,m){msg(m,T('proc'),true);fetch(u,{method:'POST'}).then(function(r){return r.text()}).then(function(t){msg(m,t,true)}).catch(function(e){msg(m,T('net'),false)})}/* ---- 手动裁剪:默认居中正方形,可拖动/缩放,确认后按选区裁剪并上传 ---- */var C={img:null,x:0,y:0,s:0,tgt:null};function boxPos(){var b=fid('cbox');b.style.left=C.x+'px';b.style.top=C.y+'px';b.style.width=C.s+'px';b.style.height=C.s+'px'}function clampBox(){var w=fid('cimg').clientWidth,h=fid('cimg').clientHeight;C.s=Math.max(32,Math.min(C.s,w,h));C.x=Math.max(0,Math.min(C.x,w-C.s));C.y=Math.max(0,Math.min(C.y,h-C.s));boxPos()}var drag=null;fid('cbox').addEventListener('pointerdown',function(e){if(e.target.id=='chandle')return;drag={x:e.clientX,y:e.clientY,ox:C.x,oy:C.y};fid('cbox').setPointerCapture(e.pointerId);e.preventDefault()});fid('chandle').addEventListener('pointerdown',function(e){e.stopPropagation();drag={rs:1,x:e.clientX,y:e.clientY,os:C.s};fid('chandle').setPointerCapture(e.pointerId);e.preventDefault()});window.addEventListener('pointermove',function(e){if(!drag)return;if(drag.rs){C.s=Math.max(32,Math.min(drag.os+Math.max(e.clientX-drag.x,e.clientY-drag.y),fid('cimg').clientWidth,fid('cimg').clientHeight));}else{C.x=drag.ox+e.clientX-drag.x;C.y=drag.oy+e.clientY-drag.y;}clampBox()});window.addEventListener('pointerup',function(){drag=null});function openCrop(file,u,size,mode,m){if(!file){msg(m,T('pick'),false);return}C.tgt={u:u,size:size,mode:mode,m:m};msg(m,T('proc'),true);var img=new Image();img.onload=function(){C.img=img;fid('cimg').src=img.src;fid('crop').style.display='block';requestAnimationFrame(function(){var w=fid('cimg').clientWidth,h=fid('cimg').clientHeight;var s=Math.floor(Math.min(w,h)*0.8);C.x=Math.floor((w-s)/2);C.y=Math.floor((h-s)/2);C.s=s;clampBox()})};img.onerror=function(){msg(m,T('dec'),false)};img.src=URL.createObjectURL(file)}function closeCrop(){fid('crop').style.display='none';C.tgt=null}function cancelCrop(){closeCrop()}function finishCrop(){if(!C.tgt)return;var t=C.tgt;var scale=C.img.naturalWidth/fid('cimg').clientWidth;var sx=Math.round(C.x*scale),sy=Math.round(C.y*scale),ss=Math.round(C.s*scale);var cv=document.createElement('canvas');cv.width=t.size;cv.height=t.size;var cx=cv.getContext('2d');cx.drawImage(C.img,sx,sy,ss,ss,0,0,t.size,t.size);var d=cx.getImageData(0,0,t.size,t.size).data;var body;if(t.mode=='rgb565'){body=new Uint8Array(t.size*t.size*2);for(var i=0;i<t.size*t.size;i++){var v=((d[i*4]>>3)<<11)|((d[i*4+1]>>2)<<5)|(d[i*4+2]>>3);body[i*2]=v&255;body[i*2+1]=v>>8;}}else{body=new Uint8Array(t.size*t.size>>3);for(var j=0;j<t.size*t.size;j++){var lum=(d[j*4]*3+d[j*4+1]*4+d[j*4+2])>>3;if(lum>127)body[j>>3]|=1<<(j&7);}}msg(t.m,T('uping'),true);fetch(t.u,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:body}).then(function(r){return r.text()}).then(function(tx){msg(t.m,tx,true);closeCrop()}).catch(function(e){msg(t.m,T('net'),false)})}/* ---- 心跳:每 10 秒探测一次设备,顺带显示热点剩余时间 ---- */function beat(){fetch('/api/config').then(function(r){return r.json()}).then(function(c){var s=Math.max(0,Math.round((c.remaining||0)/1000));fid('beat').textContent=T('alive')+s+T('unit');fid('beat').style.color='#7ce38b'}).catch(function(){fid('beat').textContent=T('dead');fid('beat').style.color='#ff6b6b'})}setInterval(beat,10000);buildQr();fid('notes').addEventListener('input',notesCount);fid('b_ntxt').addEventListener('click',loadTxt);fid('b_npx').addEventListener('click',loadPptx);fid('b_ns').addEventListener('click',saveNotes);fid('b_nc').addEventListener('click',function(){fid('notes').value='';notesCount();clr('/api/notes',fid('nm'))});fetch('/api/notes').then(function(r){return r.text()}).then(function(t){fid('notes').value=t||'';notesCount()}).catch(function(){notesCount()});fetch('/api/config').then(function(r){return r.json()}).then(function(c){fid('ssid').value=c.sta_ssid||'';fid('bname').value=c.name||'';fid('borg').value=c.org||'';fid('btitle').value=c.title||'';fid('bhide').checked=!!c.hide;fid('vurl').value=c.voice_url||'';for(var i=0;i<4;i++){fid('qt'+i).value=(c.qr_text||[])[i]||'';fid('ql'+i).value=(c.qr_label||[])[i]||'';var up=((c.qr_mode||0)>>i)&1;fid('qg'+i).checked=!up;fid('qu'+i).checked=up;qmode(i)}LANG=c.lang?1:0;applyLang()}).then(beat).catch(function(){applyLang();beat()});</script></body></html>
